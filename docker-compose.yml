# ALTERNATIVA local (opcional). Exige Docker Desktop. Defina NEO4J_PASSWORD no .env (mín. 8 caracteres).
# Depois use no .env: MONGO_URI=mongodb://localhost:27017 | REDIS_URL=redis://localhost:6379/0 | NEO4J_URI=bolt://localhost:7687
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes: [neo4j_data:/data]
volumes:
  mongo_data:
  neo4j_data:
